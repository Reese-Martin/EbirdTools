[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigyear-planner"
version = "0.1.0"
description = "Auditable perfect-hindsight historical birding route experiments"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "shapely>=2.0,<3", "numpy>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
gis = ["pyshp>=3.1,<4"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]

[project.scripts]
bigyear = "bigyear_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
